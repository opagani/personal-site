{% extends "base.html" %}

{% block content %}
<section class="hero">
  {% if site.avatar %}
    <img class="avatar" src="{{ site.avatar }}" alt="{{ site.name }}">
  {% endif %}
  <h1>{{ site.name }}</h1>
  <p class="headline">{{ site.headline }}</p>
  <p class="bio">{{ site.bio }}</p>
</section>
{% endblock %}
